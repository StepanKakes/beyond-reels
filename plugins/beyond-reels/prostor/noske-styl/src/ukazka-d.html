<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1440, height=1080">
    <title>Noske styl: web už nikoho nezajímá</title>
    <script>window.NK_FPS = 25;</script>
    <script src="vendor/gsap.min.js"></script>
    <script src="js/noske-kit.js"></script>
    <link rel="stylesheet" href="noske-kit.css">
    <style>
      body { margin: 0; background: var(--tma); }
      #root { position: relative; width: 1440px; height: 1080px; overflow: hidden; }
      #kamera { z-index: 1; }
      .broll { z-index: 2; transform-origin: 50% 50%; }
      .nk-titulky { --titulky-y: 63%; z-index: 8; }
      #vsichni .vymena { font-size: 96px; }
      #penize .vymena { font-size: 150px; }
      #predtim .vymena { font-size: 190px; }
      #predtim .maly { font-size: 52px; }
      #krok .vymena { font-size: 170px; }
    </style>
  </head>
  <body>
    <div id="root" class="nk-plocha" data-composition-id="main" data-start="0" data-width="1440" data-height="1080" data-fps="25" data-duration="{{D+0.6}}">
      <audio id="hlas" src="assets/media/hlas_D.wav" data-start="0" data-duration="{{D}}" data-track-index="10" data-volume="1"></audio>
      <audio id="hudba" src="assets/media/hudba_D.wav" data-start="0" data-duration="{{D+0.6}}" data-track-index="11" data-volume="1"></audio>
      <audio id="sfx" src="assets/media/sfx_D.wav" data-start="0" data-duration="{{D+0.6}}" data-track-index="12" data-volume="1"></audio>

      <video id="kamera" class="clip nk-video" src="assets/media/kamera_D.mp4" muted playsinline data-start="0" data-duration="{{D}}" data-track-index="0"></video>
      <video id="bTelefon" class="clip nk-video broll" src="assets/media/b_telefon.mp4" muted playsinline data-start="{{T(21)-F(1)}}" data-duration="{{Math.min(2.5,T(30)-T(21)+F(1))}}" data-track-index="1"></video>
      <video id="bNotebook" class="clip nk-video broll" src="assets/media/b_notebook.mp4" muted playsinline data-start="{{T(38)-F(1)}}" data-duration="{{T(45)-T(38)}}" data-track-index="2"></video>
      <video id="bSurf" class="clip nk-video broll" src="assets/media/b_surf.mp4" muted playsinline data-start="{{T(121)-F(1)}}" data-duration="{{T(124)-T(121)}}" data-track-index="1"></video>
      <video id="bKlient" class="clip nk-video broll" src="assets/media/b_klient.mp4" muted playsinline data-start="{{T(129)-F(1)}}" data-duration="{{T(135)-T(129)}}" data-track-index="2"></video>
      <video id="bVila" class="clip nk-video broll" src="assets/media/b_vila.mp4" muted playsinline data-start="{{T(161)-F(1)}}" data-duration="{{T(163)-T(161)}}" data-track-index="1"></video>

      <div id="titulky" class="nk-titulky"></div>

      <div id="krok" class="nk-karta"><div class="stred nk-kotva"><div class="maly">už dneska</div><div class="vymena"></div></div></div>
      <div id="insta" class="nk-karta"><div class="nk-rozhozena"></div></div>
      <div id="firma" class="nk-karta"><div class="nk-rozhozena"></div></div>
      <div id="vsichni" class="nk-karta"><div class="stred nk-kotva"><div class="maly">všichni</div><div class="vymena"></div></div></div>
      <div id="penize" class="nk-karta"><div class="stred nk-kotva"><div class="maly">dolarů měsíčně</div><div class="vymena"></div></div></div>
      <div id="soustredit" class="nk-karta"><div class="nk-rozhozena"></div></div>
      <div id="predtim" class="nk-karta papir"><div class="stred nk-kotva"><div class="maly">všechen ten prodej se děje</div><div class="vymena"></div></div></div>
      <div id="hotovo" class="nk-karta"><div class="nk-rozhozena"></div></div>
    </div>

    <script>
      const W = /*SLOVA:D*/;
      const ST = /*STRIH*/;
      const S = W.slova, T = (i) => S[i].t, U = (i) => ST[i].od, F = NK.F, $ = (id) => document.getElementById(id);
      const VIDEO = W.delka, KONEC = VIDEO + 0.6;
      const tl = gsap.timeline({ paused: true });
      const TIT = $("titulky");
      const P = (i) => T(i) - F(1);   // vstup o snímek před slovem

      /* KAMERA: každý skutečný střih střídá zoom 1,0 a 1,15 od horního okraje, mezi střihy drift +3 % */
      const PUNCH = 1.15;
      let zz = 1; const ZOOM = ST.map((u, i) => { if (i && Math.abs(ST[i - 1].src + ST[i - 1].delka - u.src) > 0.001) zz = zz === 1 ? PUNCH : 1; return zz; });
      ST.forEach((u, i) => {
        const t0 = u.od, t1 = ST[i + 1] ? ST[i + 1].od : VIDEO, z = ZOOM[i];
        const navaz = i && ZOOM[i] === ZOOM[i - 1];
        if (i === 0) { NK.uvod(tl, $("kamera"), 0, { od: 1.25, snimku: 40 }); tl.to($("kamera"), { scale: 1.03, duration: t1 - F(40), ease: "sine.inOut" }, F(40)); }
        else if (!navaz) NK.drift(tl, $("kamera"), t0, t1, z, z * 1.03);
      });
      ["bTelefon", "bNotebook", "bSurf", "bKlient", "bVila"].forEach((id) => {
        const el = $(id), t0 = +el.dataset.start, d = +el.dataset.duration;
        tl.fromTo(el, { scale: 1 }, { scale: 1.04, duration: d, ease: "sine.inOut", immediateRender: false }, t0);
        NK.naBrollu(tl, TIT, t0, t0 + d);
      });

      /* KARTY */
      const kKrok = [P(54), P(60)], kInsta = [P(60), P(69)], kFirma = [P(100), P(104)], kVsichni = [P(147), P(156)],
        kPenize = [P(172), P(178)], kSoust = [P(222), P(225)], kPredtim = [P(225), P(231)], kHotovo = [P(243), KONEC];

      NK.karta(tl, $("krok"), ...kKrok);
      NK.kotva(tl, $("krok"), [{ text: "nikoho", t: kKrok[0] }, { text: "nezajímá", t: P(57) }, { text: "tvůj web", t: P(58) }], kKrok[1]);

      NK.karta(tl, $("insta"), ...kInsta);
      NK.rozhozena(tl, $("insta").firstElementChild, [
        { text: "postav", x: 0.2, y: -110, v: 70, t: P(60) },
        { text: "Instagram", x: 0.5, y: -110, v: 104, t: P(62) },
        { text: "profil", x: 0.8, y: -110, v: 92, t: P(63) },
        { text: "postav", x: 0.2, y: 100, v: 70, t: P(64) },
        { text: "YouTube", x: 0.5, y: 100, v: 120, t: P(67) },
        { text: "kanál", x: 0.8, y: 100, v: 130, t: P(68), kurziva: true },
      ], kInsta[1]);

      NK.karta(tl, $("firma"), ...kFirma);
      NK.rozhozena(tl, $("firma").firstElementChild, [
        { text: "majitel firmy", x: 0.3, y: -120, v: 90, t: P(100) },
        { text: "coach", x: 0.74, y: -120, v: 120, t: P(102) },
        { text: "konzultant", x: 0.5, y: 90, v: 170, t: P(103), kurziva: true },
      ], kFirma[1]);

      NK.karta(tl, $("vsichni"), ...kVsichni);
      NK.kotva(tl, $("vsichni"), [{ text: "známe jeho příběh", t: kVsichni[0] }, { text: "dokážeme poznat", t: P(154) }], kVsichni[1]);

      NK.karta(tl, $("penize"), ...kPenize);
      NK.kotva(tl, $("penize"), [{ text: "stovky tisíc", t: kPenize[0] }, { text: "miliony", t: P(175) }], kPenize[1]);

      NK.karta(tl, $("soustredit"), ...kSoust);
      NK.rozhozena(tl, $("soustredit").firstElementChild, [
        { text: "člověk", x: 0.3, y: -120, v: 80, t: P(222) },
        { text: "potřebuje", x: 0.72, y: -120, v: 100, t: P(223) },
        { text: "soustředit", x: 0.5, y: 90, v: 230, t: P(224), kurziva: true },
      ], kSoust[1]);

      NK.karta(tl, $("predtim"), ...kPredtim);
      NK.kotva(tl, $("predtim"), [{ text: "předtím", t: P(230) }], kPredtim[1]);

      NK.karta(tl, $("hotovo"), ...kHotovo);
      NK.rozhozena(tl, $("hotovo").firstElementChild, [
        { text: "nadpis", x: 0.26, y: -110, v: 110, t: P(243) },
        { text: "video", x: 0.74, y: -110, v: 110, t: P(244) },
        { text: "tlačítko", x: 0.3, y: 95, v: 150, t: P(245) },
        { text: "hotovo", x: 0.72, y: 95, v: 190, t: P(246), kurziva: true },
      ], null);

      /* VRSTVENÉ SESTAVY */
      NK.zaostreniVrstvy(tl, TIT, 0, { sila: 0.7, kratce: true });
      const K = (a, b, konec, extra = {}) => NK.sestava(tl, TIT, S, { typ: "kicker", a, b, konec, ...extra });
      const SEST = [
        K([0, 5], [6, 6], P(7), { hook: true, hookSnimku: 13, hookOd: 1.9, nastupB: 8 }),
        K([7, 11], [12, 12], P(13)),
        K([18, 19], [20, 20], P(21)),
        K([21, 22], [23, 23], P(24)),
        K([24, 28], [29, 29], P(30)),
        K([33, 35], [36, 36], P(37)),
        K([47, 52], [53, 53], P(54), { serifB: true }),
        K([69, 72], [73, 73], P(74)),
        K([74, 74], [75, 75], P(76)),
        K([76, 81], [82, 83], P(84)),
        K([84, 88], [89, 89], P(90)),
        K([108, 109], [110, 110], P(111)),
        NK.sestava(tl, TIT, S, { typ: "schody", radky: [[111, 111], [112, 112]], serifRadek: 1, konec: P(113), rozmazat: true }),
        K([119, 120], [121, 121], P(122)),
        K([124, 127], [128, 128], P(129)),
        K([135, 140], [141, 141], P(142), { serifB: true }),
        K([158, 161], [162, 162], P(163)),
        K([163, 165], [166, 166], P(167)),
        K([178, 183], [184, 184], P(185)),
        K([191, 195], [196, 196], P(197)),
        NK.sestava(tl, TIT, S, { typ: "schody", radky: [[200, 202], [203, 205]], serifRadek: 1, konec: P(206), rozmazat: true }),
        K([206, 207], [208, 208], P(209)),
        K([209, 212], [213, 213], P(214)),
        K([214, 217], [218, 218], P(219), { serifB: true }),
        K([237, 241], [242, 242], P(243)),
      ];

      /* TITULKY PO SLOVECH */
      const st = (v, serif) => ({ v, kurziva: !!serif });
      const STYL = {
        17: st("l"), 37: st("l"), 40: st("l"), 41: st("xl"), 44: st("l"), 45: st("l"), 46: st("xl"),
        92: st("l"), 95: st("l"), 96: st("l"), 97: st("xl"), 98: st("l"), 99: st("xl"), 105: st("l"),
        114: st("l"), 117: st("l"), 118: st("xl"), 122: st("l"), 123: st("xl", 1),
        131: st("l"), 134: st("xl"), 142: st("l"), 145: st("l"), 146: st("xl"),
        168: st("l"), 185: st("l"), 189: st("l"), 190: st("xl"), 198: st("l"), 199: st("xl"),
        220: st("l"), 233: st("l"), 236: st("xl"),
      };
      const VYNECH = [kKrok, kInsta, kFirma, kVsichni, kPenize, kSoust, kPredtim, kHotovo, ...SEST];
      NK.titulky(tl, TIT, S, { styl: STYL, vynech: VYNECH });

      tl.set({}, {}, KONEC);
      window.__timelines = window.__timelines || {};
      window.__timelines.main = tl;
    </script>
  </body>
</html>
