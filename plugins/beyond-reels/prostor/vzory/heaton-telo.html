    <script>
      const W = /*SLOVA:ZAC*/.slova, ST = /*SLOVA:ZACSTRIHY*/;
      const root = document.getElementById("root");
      MK.init(root);
      const tl = gsap.timeline({ paused: true });
      const F = (n) => n / 30, $ = (id) => document.getElementById(id), T = (i) => W[i].t, KONEC = ST.konec;
      const R = (t) => Math.round(t * 30) / 30;
      // čas těla > čas kompozice: za každou citací se tělo posune o její délku
      const BOD = []; let _p = 0; ST.citace.forEach(([a, b]) => { BOD.push([a - _p, b - a]); _p += b - a; });
      const B = (b) => R(b + BOD.reduce((s, [x, d]) => s + (b >= x - 1e-6 ? d : 0), 0));
      const Bk = (b) => R(b + BOD.reduce((s, [x, d]) => s + (b > x + 1e-6 ? d : 0), 0));   // konec úseku: v místě citace ještě před ní
      const ZA = /*SLOVA:ZA*/;   // slova za osobou (nastroje/za_osobou.py): jméno -> [od, snímků, časy slov]
      const vis = (el, t) => tl.set(el, { visibility: "visible" }, t), hid = (el, t) => tl.set(el, { visibility: "hidden" }, t);
      const sc = (id, t0, t1) => { tl.set($(id), { display: "block" }, R(t0)); tl.set($(id), { display: "none" }, R(t1)); };
      const naskoc = (el, t, n = 3) => { vis(el, t); MK.tw(tl, el, { opacity: 0.4 }, { opacity: 1 }, t, n, { k: 0.6 }); };   // text plynule (Tim: low framerate jen na grafiku, ne na text)
      // Tim 12. 10.: jen dva švihy, hluboký (střihy a přílety) a vzdušný (karty a přesuny), oba ztlumené, ať nejsou výrazné
      const SVIHY = { svih: ["svih_vitr", -6], svih2: ["svih_vitr", -6], svih_rychly: ["svih_hluboky", -7], svih_hluboky: ["svih_hluboky", -6] };
      const SFX = []; const zv = (t, n, g) => { const m = SVIHY[n]; if (m) { n = m[0]; g += m[1]; } SFX.push([Math.round(t * 1000) / 1000, n, g]); };   // zvuky navázané na změny v obraze (zvuk_heaton.py)
      const blesk = (t, s = 0.85) => [s, s * 0.45, s * 0.15, 0].forEach((o, i) => tl.set($("blesk"), { opacity: o }, t + F(i)));
